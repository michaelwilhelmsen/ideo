[package]
name = "ideo"
version = "0.1.0"
description = "Ideo"
authors = ["Michael Wilhelmsen"]
edition = "2021"
rust-version = "1.82"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ideo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "macos-private-api"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-log = "2"
tauri-plugin-notification = "2"
tauri-plugin-persisted-scope = "2"
tauri-plugin-process = "2"
tauri-plugin-os = "2"
tauri-plugin-global-shortcut = "2"
log = "0.4"
regex = "1"
# The rebuildable index of PRD §3.2. `bundled` so there is no dependency on
# whatever SQLite the host happens to ship. `rusqlite` over `sqlx` because the
# queries are list/upsert/delete and the async work is HTTP, not SQL.
rusqlite = { version = "0.37", features = ["bundled"] }

# Type-safe Tauri command bindings
specta = { version = "=2.0.0-rc.22", features = ["derive", "serde_json"] }
tauri-specta = { version = "=2.0.0-rc.21", features = ["typescript"] }
specta-typescript = "=0.0.9"
# HTTP client — all authenticated calls happen in Rust so keys never reach the webview
# `query` is for fal's billing events (#56), the one call we make with a query
# string rather than a JSON body — and the one whose cursor is an opaque token
# that has to be escaped by something that knows how.
reqwest = { version = "0.13.3", default-features = false, features = ["json", "query", "rustls", "charset", "http2", "system-proxy"] }
# `sync` for the semaphore that caps concurrent jobs (PRD §3.3) — a 4-up batch
# is already four charged calls, and nothing else stops them stacking.
tokio = { version = "1.53.1", default-features = false, features = ["time", "sync"] }
# Dimensions from a file header, without decoding it. Kept alongside `image`
# rather than replaced by it: `downscale` reads every input's size to decide
# whether to touch it at all, and only the ones it decides to shrink get decoded.
imagesize = "0.14"
# Decoding, resizing and re-encoding an input image before it is sent (#51).
# Codecs are named explicitly rather than taking `default-features`: the three
# here are what `sniff_format` accepts, and the default set pulls a dozen more
# (TIFF, EXR, DDS, HDR…) that no input can ever be.
image = { version = "0.25.6", default-features = false, features = ["png", "jpeg", "webp"] }

# OS keychain for the fal.ai API key. Backends are selected per platform so the
# cross-platform CI build doesn't pull the others' native dependencies.
[dev-dependencies]
# Project storage is tested against real directories rather than a mocked
# filesystem — atomicity and rescanning are properties of the filesystem, and a
# mock would only prove the mock.
tempfile = "3"
# A runtime to drive the async seams under test — the billing pagination loop is
# the only one, and it is tested with the network replaced by a closure. Dev-only
# on purpose: the app's own `tokio` features stay at `time` and `sync`.
tokio = { version = "1.53.1", features = ["macros", "rt"] }

[target.'cfg(target_os = "macos")'.dependencies.keyring]
version = "3"
features = ["apple-native"]

[target.'cfg(target_os = "windows")'.dependencies.keyring]
version = "3"
features = ["windows-native"]

[target.'cfg(target_os = "linux")'.dependencies.keyring]
version = "3"
features = ["sync-secret-service"]

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"

# macOS-only: NSPanel for native panel behavior (fullscreen overlay, click-outside dismiss)
[target.'cfg(target_os = "macos")'.dependencies]
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", branch = "v2.1" }

# Optimize for smaller binary size in release builds
[profile.release]
codegen-units = 1        # Better LLVM optimization (slower build, smaller binary)
lto = true               # Link-time optimizations
opt-level = "s"          # Optimize for size over speed
panic = "abort"          # Don't include panic unwinding code
strip = true             # Remove debug symbols

